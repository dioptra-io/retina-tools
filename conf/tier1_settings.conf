# Settings for cron/tier1_wrapper.sh.
# Sourced after common.sh, so ${TOPLEVEL} is already set.

DATA_DIR="${TOPLEVEL}/tier1exclusions/output"
# LOG_DIR is derived from DATA_DIR, not set independently — overriding DATA_DIR (e.g.
# to a real deployment's data directory, outside this git checkout) moves the log
# location along with it, rather than needing two paths kept in sync by hand.
LOG_DIR="$(dirname "${DATA_DIR}")/logs"
PRUNE_DAYS=90