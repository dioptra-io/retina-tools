# Settings for cron/tier1_wrapper.sh.
# Sourced after common.sh, so ${TOPLEVEL} is already set.

DATA_DIR="${TOPLEVEL}/tier1exclusions/output"
# Derived from DATA_DIR so overriding one moves both together.
LOG_DIR="$(dirname "${DATA_DIR}")/logs"
# Small JSON files, not the PD pipeline's huge iris_zeph tables — retaining more
# of them under the biweekly cadence (~6 runs vs ~3 under monthly) costs little.
PRUNE_DAYS=90