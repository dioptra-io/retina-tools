# Settings for cron/tier1_wrapper.sh.
# Sourced after common.sh, so ${TOPLEVEL} is already set.

# HOME-relative, not TOPLEVEL-relative: this holds accumulated exclusion-list
# history that the churn-analysis practice in METHODOLOGY.md depends on comparing
# across runs — it must survive independently of the repo checkout's own
# lifecycle (e.g. a redeploy via fresh clone rather than an in-place git pull
# would otherwise destroy it).
DATA_DIR="${HOME}/tier1exclusions/output"
# Shared with pd_wrapper.sh's LOG_DIR — one log directory, not one per pipeline.
# No longer derived from DATA_DIR (they're independent now); each wrapper's
# failure marker is prefixed (tier1_/pd_) to avoid the two colliding here.
LOG_DIR="${HOME}/logs"
# Small JSON files, not the PD pipeline's huge iris_zeph tables — retaining 90
# daily runs' worth costs little.
PRUNE_DAYS=30

# GCP Secret Manager secret name holding BGP_API_KEYS — fetched fresh at the start
# of each run via the VM's service account (roles/secretmanager.secretAccessor on
# this secret required), never stored locally. See tier1_wrapper.sh.
BGP_API_KEYS_SECRET_NAME="bgp-api-keys"