# Settings for cron/pd_wrapper.sh.
# Sourced after common.sh, so ${TOPLEVEL} is already set.

OUTPUT_DIR="${HOME}/pds"
# LOG_DIR is derived from OUTPUT_DIR, not set independently — same reasoning as
# tier1_settings.conf: overriding OUTPUT_DIR moves the log location with it.
LOG_DIR="$(dirname "${OUTPUT_DIR}")/pd_logs"
# Shorter retention than tier1exclusions' PRUNE_DAYS=90: this pipeline runs daily,
# not monthly, so the same day-count would retain many more files. 30 days keeps
# roughly a month of PD history.
PRUNE_DAYS=30