# Settings for cron/pd_wrapper.sh.
# Sourced after common.sh, so ${TOPLEVEL} is already set.

OUTPUT_DIR="${HOME}/pds"
# LOG_DIR is derived from OUTPUT_DIR, not set independently — same reasoning as
# tier1_settings.conf: overriding OUTPUT_DIR moves the log location with it.
LOG_DIR="$(dirname "${OUTPUT_DIR}")/pd_logs"
# Shorter retention than tier1exclusions' PRUNE_DAYS=90: this pipeline runs daily,
# not monthly, so the same day-count would retain many more files. 30 days keeps
# roughly a month of PD history.
PRUNE_DAYS=30
# Much shorter than PRUNE_DAYS above — this governs the raw Iris link tables in
# ClickHouse (iris_zeph__links__*/iris_ipv6__links__*), not the small PD output
# files. These are large (500M+ rows per table observed in production) and serve no
# purpose once that day's PDs are generated from them, so a few days of retention
# (for debugging a recent failed run) is enough; keeping a month's worth like the
# output files would reintroduce the disk-space growth problem this is meant to fix.
IRIS_TABLE_RETENTION_DAYS=3